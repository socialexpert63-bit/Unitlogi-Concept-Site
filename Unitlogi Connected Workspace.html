function score(c,p){const r={ok:[],no:[],ver:[...p.verify],pts:0};
 const [lo,hi]=c.budget;
 if(p.price>=lo&&p.price<=hi){r.pts+=35;r.ok.push('Price '+aed(p.price)+' is inside the budget')}else if(p.price>hi&&p.price<=hi*1.1){r.pts+=15;r.no.push('Price is up to 10% above budget ('+aed(p.price)+')')}else r.no.push('Price '+aed(p.price)+' is outside the budget');
 if(c.locs.includes(p.loc)){r.pts+=25;r.ok.push('Location '+p.loc+' is preferred')}else r.no.push(p.loc+' is not a preferred location');
 if(p.type===c.ptype){r.pts+=20;r.ok.push('Property type matches ('+p.type+')')}else r.no.push('Type is '+p.type+', client wants '+c.ptype);
 if(p.beds===c.beds){r.pts+=20;r.ok.push(p.beds+' bedrooms as required')}else if(p.beds>c.beds){r.pts+=14;r.no.push(p.beds+' bedrooms, client asked for '+c.beds+' (more than needed)')}else r.no.push(p.beds+' bedrooms, fewer than the '+c.beds+' required');
 if(p.status!=='Available')r.ver.push('Status is '+p.status+', confirm availability');
 return r}

 discM(el){const p=props.find(x=>x.id===el.dataset.id),c=cl(S.matchClient);c.tl.unshift({d:TODAY,k:'Property discussion',x:'Discussed '+p.title+'.'});toast('Discussion recorded on '+c.name+'’s timeline')},
 newD(){modal(`<h2>New opportunity</h2><form><label>Client<select name="cid">${fuOpts(S.cid)}</select></label><label>Interested property<select name="prop">${props.map(p=>`<option>${p.title}</option>`).join('')}</select></label><label>Estimated value (AED)<input name="val" type="number" required></label><div class="row"><button class="btn p">Create</button><button type="button" class="btn" data-close>Cancel</button></div></form>`,(v,close)=>{deals.push({id:'d'+(deals.length+1),cid:v.cid,prop:v.prop,val:+v.val,broker:'Sara Nasser',stage:'New Opportunity',last:TODAY,next:TODAY,notes:''});close();toast('Opportunity created');rerender()})},
 editD(el){const d=deals.find(x=>x.id===el.dataset.id);const c=cl(d.cid);modal(`<h2>${c.name}: ${d.prop}</h2><form><label>Stage<select name="stage">${stages.map(s=>`<option ${d.stage===s?'selected':''}>${s}</option>`).join('')}</select></label><div class="row"><label style="flex:1">Value (AED)<input name="val" type="number" value="${d.val}"></label><label style="flex:1">Next follow-up<input name="next" type="date" value="${d.next}"></label></div><label>Notes<textarea name="notes" rows="3">${esc(d.notes)}</textarea></label><p class="mute">Last interaction: ${esc(c.tl[0]?.x||'none')}</p><div class="row"><button class="btn p">Confirm changes</button><button type="button" class="btn" data-close>Cancel</button></div></form>`,(v,close)=>{Object.assign(d,{stage:v.stage,val:+v.val,next:v.next,notes:v.notes});close();toast('Opportunity updated');rerender()})},
 ask(el){const k=el.dataset.id,c=cl(S.cid),labels={sum:'Summarize latest discussion',chg:'What changed in requirements?',draft:'Draft a follow-up message',desc:'Prepare a property description',prio:'Criteria that matter most'};$('#ailog').innerHTML+='<div class="typing" id="ty" style="margin-top:12px"><span></span><span></span><span></span></div>';setTimeout(()=>{S.aiLog=S.aiLog.filter(m=>m.k!==k);S.aiLog.push({k,q:labels[k],a:AIR[k](c)});rerender()},700)},
 cp(el){navigator.clipboard?.writeText(el.dataset.t).catch(()=>{});toast('Copied')},
 merge(el){S.dup=S.dup.filter(p=>p.join('|')!==el.dataset.id);toast('Flagged for merge. A manager confirms before records combine.');rerender()},
 nodup(el){S.dup=S.dup.filter(p=>p.join('|')!==el.dataset.id);toast('Dismissed');rerender()},
 saveL(){S.lang=S.pendingLang;toast('Preferences saved');rerender()},
 canL(){S.pendingLang=S.lang;toast('Changes cancelled');rerender()},
 nt(el){S.notif[el.dataset.id]=el.checked;toast('Notification preference saved')}
};
A.unshort=el=>{S.short[S.cid]=(S.short[S.cid]||[]).filter(x=>x!==el.dataset.id);rerender()};
A.plan=()=>{const c=cl(S.cid),l=(S.short[c.id]||[]).map(id=>props.find(p=>p.id===id)).sort((a,b)=>a.loc.localeCompare(b.loc));modal(`<h2>Viewing plan for ${c.name}</h2><p class="mute">Ordered by area to keep travel short. You confirm every slot.</p><form><div class="row"><label style="flex:1">Date<input name="d" type="date" value="2026-11-21" required></label><label style="flex:1">First viewing at<input name="tm" type="time" value="10:00"></label></div>${l.map((p,i)=>`<div class="item"><div><b>${p.title}</b><div class="mute">${p.loc}</div></div><span class="pill">Slot ${i+1}</span></div>`).join('')}<div class="row" style="margin-top:12px"><button class="btn p">Add to follow-ups</button><button type="button" class="btn" data-close>Cancel</button></div></form>`,(v,close)=>{let [h,mi]=v.tm.split(':').map(Number);l.forEach(p=>{fus.push({id:'f'+(fus.length+1),cid:c.id,d:v.d,type:'Meeting',next:`Viewing: ${p.title} at ${String(h).padStart(2,'0')}:${String(mi).padStart(2,'0')}`,pri:'High',done:false});h++});close();toast('Viewing plan added to follow-ups');rerender()})};
A.theme=()=>{const r=document.documentElement,cur=r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');r.dataset.theme=cur==='dark'?'light':'dark'};
A.pal=()=>{const m=modal('<input id="pi" class="search" style="width:100%;margin-bottom:10px" placeholder="Search clients, properties, pages" aria-label="Search"><div id="pr"></div>',()=>{});const items=()=>[...Object.keys(views).map(r=>({l:t(r),k:'Page',v:r})),...clients.map(c=>({l:c.name,k:'Client',v:'c:'+c.id})),...props.map(p=>({l:p.title,k:'Property',v:'p:'+p.id}))];const draw=q=>{m.querySelector('#pr').innerHTML=items().filter(i=>i.l.toLowerCase().includes(q.toLowerCase())).slice(0,8).map(i=>`<button class="btn" style="display:flex;justify-content:space-between;width:100%;margin-bottom:6px" data-a="go" data-id="${i.v}"><span>${i.l}</span><span class="mute">${i.k}</span></button>`).join('')||'<p class="mute">No results.</p>'};draw('');const pi=m.querySelector('#pi');pi.addEventListener('input',e=>draw(e.target.value));pi.focus()};
A.go=el=>{const v=el.dataset.id;document.querySelector('.modal')?.remove();if(v.startsWith('c:')){S.cid=v.slice(2);S.matchClient=S.cid;location.hash==='#clients'?rerender():location.hash='#clients'}else if(v.startsWith('p:')){S.pf.q=props.find(x=>x.id===v.slice(2)).title;location.hash==='#properties'?rerender():location.hash='#properties'}else location.hash='#'+v};
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();A.pal()}});
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.closest('.modal')&&!el.closest('.modal [data-a]'))return;if(el.dataset.a==='editD'&&e.target.closest('.deal')===null)return;const f=A[el.dataset.a];if(f&&el.type!=='checkbox')f(el)});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset?.a==='nt')A.nt(el)});
addEventListener('hashchange',route);route();
</script>
