function score(c,p){const r={ok:[],no:[],ver:[...p.verify],pts:0};
 const [lo,hi]=c.budget;
 if(p.price>=lo&&p.price<=hi){r.pts+=35;r.ok.push('Price '+aed(p.price)+' is inside the budget')}else if(p.price>hi&&p.price<=hi*1.1){r.pts+=15;r.no.push('Price is up to 10% above budget ('+aed(p.price)+')')}else r.no.push('Price '+aed(p.price)+' is outside the budget');
 if(c.locs.includes(p.loc)){r.pts+=25;r.ok.push('Location '+p.loc+' is preferred')}else r.no.push(p.loc+' is not a preferred location');
 if(p.type===c.ptype){r.pts+=20;r.ok.push('Property type matches ('+p.type+')')}else r.no.push('Type is '+p.type+', client wants '+c.ptype);
 if(p.beds===c.beds){r.pts+=20;r.ok.push(p.beds+' bedrooms as required')}else if(p.beds>c.beds){r.pts+=14;r.no.push(p.beds+' bedrooms, client asked for '+c.beds+' (more than needed)')}else r.no.push(p.beds+' bedrooms, fewer than the '+c.beds+' required');
 if(p.status!=='Available')r.ver.push('Status is '+p.status+', confirm availability');
 return r}

 const s=await sampler();
 if(!s){into(fallback,true);return fallback}
 try{const r=await s([{role:'user',content:RULES+'\n\n'+ctx()+'\n\n'+prompt}],{cache:false,modelTier:'quick',onText:({text})=>into(text,false)});into(r.text,true);return r.text}

<script>

(function(){
let U=0;const hs=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h};
function art(key,w,h,kind){const s=hs(key),hue=[190,210,25,265,160][s%5],id='a'+(U++),r=n=>((s>>(n%20))&255)/255;
 let b='',x=0,i=0;const n=kind==='sky'?16:6;const bw=w/n;
 for(;i<n;i++){const bh=h*(.28+.55*r(i*3+1)),bx=i*bw+ (kind==='sky'?0:bw*.15),ww=bw*(kind==='sky'?.82:.72);
  b+=`<rect x="${bx.toFixed(1)}" y="${(h-bh).toFixed(1)}" width="${ww.toFixed(1)}" height="${bh.toFixed(1)}" fill="hsl(${hue} 35% ${14+Math.round(r(i)*14)}%)"/><rect x="${bx.toFixed(1)}" y="${(h-bh).toFixed(1)}" width="${ww.toFixed(1)}" height="${bh.toFixed(1)}" fill="url(#${id}w)"/>`}
 return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="100%" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><defs><linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="hsl(${hue} 70% 22%)"/><stop offset=".65" stop-color="hsl(${hue+25} 75% 55%)"/><stop offset="1" stop-color="hsl(${hue+40} 85% 72%)"/></linearGradient><pattern id="${id}w" width="7" height="9" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="3" height="4" fill="#ffe9a8" opacity=".75"/></pattern></defs><rect width="${w}" height="${h}" fill="url(#${id}g)"/><circle cx="${w*.8}" cy="${h*.28}" r="${h*.11}" fill="#fff" opacity=".55"/>${b}<rect y="${h-5}" width="${w}" height="5" fill="hsl(${hue} 40% 10%)"/></svg>`}
const av=(name,sz=34)=>{const hue=hs(name)%360,ini=name.split(' ').map(x=>x[0]).slice(0,2).join('');return `<span class="av2" style="width:${sz}px;height:${sz}px;background:linear-gradient(135deg,hsl(${hue} 65% 45%),hsl(${hue+40} 70% 35%));font-size:${sz*.38}px">${ini}</span>`};
const css=document.createElement('style');css.textContent=`
.av2{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:700;font-family:var(--head);flex:none}
.th{width:54px;height:54px;border-radius:10px;overflow:hidden;flex:none}

.pc .im{height:190px;position:relative}
.pc .im .pill{position:absolute;left:10px;top:10px;background:rgba(11,31,51,.7);color:#6fe3d4}
.pc .bd{padding:12px}.pc b{display:block;font:600 14px var(--head)}
.pc .pr{font:700 16px var(--head);color:var(--teal-d);margin-top:4px}
.brief{position:relative;overflow:hidden}.brief>*:not(.sk){position:relative;z-index:1}
.sk{position:absolute;right:0;bottom:0;width:62%;height:55%;opacity:.4;pointer-events:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 50%);mask-image:linear-gradient(90deg,transparent,#000 50%)}

.item>.th+div,.item>.av2+div{flex:1;min-width:140px}
`;document.head.append(css);
const m2=views.myday;
views.myday=()=>{let h=m2();
 h=h;
 const g=props.filter(p=>p.status==='Available').slice(0,4).map(p=>`<a class="pc" href="#properties"><div class="im">${art(p.id+p.title,320,130)}<span class="pill">${esc(p.type)}</span></div><div class="bd"><b>${esc(p.title)}</b><div class="mute">${esc(p.loc)}</div><div class="pr">${aed(p.price)}</div></div></a>`).join('');

const b0=bind;bind=function(){b0();if(S.route!=='myday')return;
 document.querySelectorAll('#view .item').forEach(it=>{if(it.querySelector('.th,.av2'))return;const t=it.textContent;
  const p=props.find(p=>t.includes(p.title));if(p){it.insertAdjacentHTML('afterbegin',`<span class="th">${art(p.id+p.title,54,54)}</span>`);return}
  const c=clients.find(c=>t.includes(c.name));if(c)it.insertAdjacentHTML('afterbegin',av(c.name))})};

 inp.onchange=()=>{const f=inp.files[0];if(!f)return;const img=new Image(),u=URL.createObjectURL(f);
  img.onload=()=>{const k=Math.min(1,900/img.width),c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);S.photos[id]=c.toDataURL('image/jpeg',.85);URL.revokeObjectURL(u);toast('Photo added');rerender()};
